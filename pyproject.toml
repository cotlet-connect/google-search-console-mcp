[project]
name = "google-search-console-cotlet-mcp"
version = "1.1.0"
description = "Connect Google Search Console to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Google Search Console API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["google search console", "google search console api", "google search console mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/google-search-console-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=google-search-console"
Source = "https://github.com/cotlet-connect/google-search-console-mcp"

[project.scripts]
google-search-console-cotlet-mcp = "google_search_console_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"google_search_console_agent.py" = "google_search_console_agent.py"

[tool.hatch.build.targets.sdist]
include = ["google_search_console_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
